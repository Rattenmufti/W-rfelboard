<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e67e22">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <title>Würfelboard v0.95 Stable</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #e67e22; --win: #27ae60; --ronny: #e74c3c; 
            --bg: #1a1a1a; --card-bg: #2c2c2c; --text: #eeeeee; --border: #444444;
            --input-focus: #3d3d3d; --table-head: #111111;
            --score-main: #000000; --orange-bar: #ff9800;
            --locked: #f1c40f;
            --near-win-bg: #d35400;
        }
        body.light-mode {
            --bg: #f8f9fa; --card-bg: #ffffff; --text: #1a1a1a; --border: #cccccc;
            --input-focus: #fffde7; --table-head: #2c3e50;
            --score-main: #111111; --orange-bar: #e67e22;
            --near-win-bg: #ffeaa7;
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* --- MOBILE TUNING --- */
        body.mobile-mode .app { 
            display: flex; 
            flex-direction: column; 
            padding-bottom: 260px !important; 
            width: 100vw;
            max-width: 100vw;
            border-radius: 0;
            height: auto !important;
            overflow-x: hidden !important;
        } 
        body.mobile-mode .game-container {
            flex: none !important;
            height: auto !important;
            width: 100% !important;
            max-width: 100% !important;
            overflow: visible !important;
        }
        body.mobile-mode .quick-pad { 
            position: fixed; bottom: 0; left: 0; width: 100vw !important;
            background: var(--card-bg); grid-template-columns: repeat(5, 1fr) !important;
            padding: 6px; gap: 4px; border-top: 3px solid var(--accent);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.6); z-index: 1100; box-sizing: border-box;
            align-self: stretch !important;
            height: auto !important;
        }
        body.mobile-mode .pad-btn { padding: 15px 0 !important; font-size: 1rem !important; }
        body.mobile-mode .btn-ronny { 
            grid-column: 1 / -1 !important; 
            padding: 18px 0 !important; 
        }
        
        body.mobile-mode .table-area { 
            max-height: none !important; 
            overflow-x: auto !important; 
            overflow-y: visible !important;
            margin-bottom: 20px;
            flex: none !important;
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box;
        }
        
        body.mobile-mode table { width: 100%; min-width: 100%; margin-bottom: 0; table-layout: fixed; }
        body.mobile-mode tfoot td { 
            position: relative; 
            z-index: 10; 
            background: var(--orange-bar); 
            border-top: 2px solid #000; 
        }

        /* --- MOBILE LANDSCAPE TUNING --- */
        @media (orientation: landscape) {
            body.mobile-mode .app {
                padding-bottom: 15px !important;
                box-sizing: border-box;
            }
            body.mobile-mode.few-players .app {
                padding-right: 280px !important;
            }
            body.mobile-mode.many-players .app {
                padding-right: 185px !important;
            }
            body.mobile-mode .quick-pad {
                top: 0 !important;
                right: 0 !important;
                left: auto !important;
                bottom: 0 !important;
                height: 100vh !important;
                grid-template-columns: repeat(3, 1fr) !important;
                border-top: none !important;
                border-left: 3px solid var(--accent);
                overflow-y: auto;
                box-shadow: -10px 0 25px rgba(0,0,0,0.6);
                padding: 6px;
                gap: 4px;
                align-self: stretch !important;
            }
            body.mobile-mode.few-players .quick-pad {
                width: 270px !important;
            }
            body.mobile-mode.many-players .quick-pad {
                width: 175px !important;
            }
            body.mobile-mode .pad-btn {
                padding: 10px 0 !important;
                font-size: 0.9rem !important;
            }
            body.mobile-mode .btn-ronny {
                grid-column: 1 / -1 !important;
                padding: 12px 0 !important;
            }
        }

        /* --- BASE / DESKTOP (Full Scaling) --- */
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); display: flex; justify-content: center; transition: 0.3s; }
        
        .app { 
            background: var(--card-bg); 
            border-radius: 0; 
            padding: 15px; 
            width: 100vw; 
            max-width: none; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            height: 100vh; 
            box-sizing: border-box;
            overflow: hidden; 
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
        .btn-top { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        
        .stats-section { background: var(--table-head); color: white; padding: 8px; border-radius: 10px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; text-align: center; flex-shrink: 0; }
        .stat-item { border-right: 1px solid #444; display: flex; flex-direction: column; }
        .stat-name { font-size: 0.6rem; color: #888; }
        .stat-wins { font-size: 0.9rem; font-weight: bold; color: #f1c40f; }
        .stat-wins .pending-win { color: #27ae60; font-weight: bold; animation: blinker 1s linear infinite; margin-left: 2px; }
        
        .setup-section { background: rgba(128,128,128,0.1); padding: 8px; border-radius: 10px; flex-shrink: 0; }
        .names-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
        .name-slot { display: flex; flex-direction: column; gap: 4px; background: var(--card-bg); padding: 6px; border-radius: 8px; border: 1px solid var(--border); }
        .name-slot input { border: 1px solid var(--border); border-radius: 4px; background: rgba(0,0,0,0.1); color: var(--text); text-align: center; padding: 4px; }
        .btn-starter { font-size: 0.6rem; padding: 3px; cursor: pointer; border: none; border-radius: 4px; background: #444; color: #ccc; }
        .btn-starter.active { background: var(--accent); color: white; }
        
        .game-container { display: flex; flex-direction: row; gap: 15px; flex: 1; min-height: 0; overflow: hidden; }
        
        .table-area { 
            flex: 2; 
            background: rgba(0,0,0,0.05); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            height: 100%; 
            overflow-y: auto; 
        }

        table { width: 100%; max-width: 100%; border-collapse: collapse; table-layout: fixed; }
        thead th { position: sticky; top: 0; z-index: 10; font-size: 0.8rem; background: var(--table-head); color: white; padding: 10px 2px; }
        tfoot td { position: sticky; bottom: 0; z-index: 10; background: var(--orange-bar); color: var(--score-main); font-weight: bold; }
        td { border: 1px solid var(--border); height: 42px; text-align: center; }
        
        .score-input { width: 100%; height: 100%; border: none; text-align: center; font-size: 1.1rem; background: transparent; color: var(--text); outline: none; }
        .score-input.system-focus { background: var(--input-focus); box-shadow: inset 0 0 0 3px var(--accent); font-weight: bold; }
        
        .quick-pad { width: 450px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex-shrink: 0; align-self: stretch; height: 100%; }
        .pad-btn { padding: 0 2px; border: none; border-radius: 8px; background: #34495e; color: white; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        .pad-btn:disabled { background: #555; color: var(--locked); }
        .btn-ronny { background: var(--ronny) !important; grid-column: span 4; padding: 0; }
        
        .score-box { display: flex; flex-direction: column; line-height: 1.1; height: 100%; justify-content: center; }
        .score-box.near-win { animation: nearWinBlinker 1.2s linear infinite; }
        .score-box.winner-blink { background-color: var(--win); animation: blinker 1.2s linear infinite; }
        .score-box.winner-blink .score-down { color: #ffffff !important; }
        .score-box.winner-blink .score-up { color: rgba(255, 255, 255, 0.8) !important; }
        
        @keyframes blinker {
            50% { opacity: 0.4; }
        }

        @keyframes nearWinBlinker {
            0% { background-color: var(--orange-bar); }
            50% { background-color: var(--near-win-bg); }
            100% { background-color: var(--orange-bar); }
        }

        .score-up { font-size: 1.0rem; color: rgba(0, 0, 0, 0.65); font-weight: bold; }
        .score-down { font-size: 1.6rem; color: #000000; font-weight: 900; }
        
        .analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; flex-shrink: 0; }
        .analysis-card { background: rgba(128,128,128,0.1); padding: 10px; border-radius: 8px; border-top: 3px solid var(--accent); border: 1px solid var(--border); }

        #histView { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:3000; display:none; padding:10px; overflow-y:auto; box-sizing: border-box; }
        .history-item { background:#333; padding:8px 12px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; color:white; font-size: 0.85rem; border-left: 4px solid var(--accent); }
        .btn-load-hist { background:var(--win); border:none; color:white; padding:6px 10px; border-radius:4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body id="mainBody">

<div class="app">
    <div id="arcBanner" style="display:none; background:var(--accent); color:white; padding:10px; text-align:center; font-weight:bold; position:fixed; top:0; width:100%; z-index:2000;" onclick="exitArchive()">⚠️ ARCHIV ANSICHT</div>

    <div class="header-bar">
        <h2 style="margin:0; font-size: 0.8rem; color: var(--accent);">Würfelboard v0.95 Stable</h2>
        <div style="display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end;">
            <button class="btn-top" onclick="toggleFullscreen()">📺 VOLLBILD</button>
            <button class="btn-top" onclick="saveCSV()">💾 BACKUP</button>
            <button class="btn-top" onclick="document.getElementById('csvIn').click()">📂 LADEN</button>
            <button id="btnViewToggle" class="btn-top" onclick="toggleMobile()">📱 MOBIL</button>
            
            <button class="btn-top" onclick="toggleTheme()">🌓 MODE</button>
            <button class="btn-top" onclick="openHistory()" style="background:var(--accent)">📜 HISTORIE</button>
            <button class="btn-top" onclick="finish()" style="background:var(--win)">✨ NEU</button>
            <button class="btn-top" onclick="askMasterReset()" style="background:#555">🔄 RESET</button>
        </div>
    </div>

    <div class="stats-section" id="statsDisp"></div>
    <div class="setup-section" id="setupArea"><div class="names-grid" id="namesGrid"></div></div>
    <div id="analysisUI" class="analysis-grid"></div>

    <div class="game-container">
        <div class="table-area">
            <table>
                <thead><tr id="hRow"></tr></thead>
                <tbody id="gBody"></tbody>
                <tfoot><tr id="tRow"></tr></tfoot>
            </table>
        </div>
        <div class="quick-pad" id="padUI"><button class="pad-btn btn-ronny" onclick="setV(0)">0 (Ronny)</button></div>
    </div>
</div>

<div id="histView">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; padding: 0 5px;">
        <h2 style="color:white; margin:0; font-size: 1.2rem;">Historie</h2>
        <button class="btn-top" onclick="document.getElementById('histView').style.display='none'" style="background:var(--ronny); padding: 5px 15px;">X</button>
    </div>
    <div id="arcList"></div>
</div>

<input type="file" id="csvIn" style="display:none" onchange="loadCSV(event)" accept=".csv,text/csv,text/plain">

<script>
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Fehler beim Aktivieren des Vollbildmodus: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    const MAX_P = 8;
    let isArcView = false, arcScores = [], arcNames = [], isQuickPress = false, isLocked = false;
    let focus = { r: 0, pI: 0, apIdx: 0 }; 
    
    function getSafe(k, f) { try { let d = localStorage.getItem(k); return d ? JSON.parse(d) : f; } catch(e) { return f; } }

    let pNames = getSafe('10k_names', ["Spieler 1", "Spieler 2", "", "", "", "", "", ""]);
    let scores = getSafe('10k_scores', [Array(MAX_P).fill("")]);
    let stats = Array(MAX_P).fill(0); 
    let archive = getSafe('10k_archive', []);
    let startIdx = getSafe('10k_startIdx', 0);
    let theme = getSafe('10k_theme', 'dark');
    
    let defaultView = window.innerWidth < 1024 ? 'mobile' : 'desktop';
    let viewMode = getSafe('10k_viewMode', defaultView);

    if(theme === 'light') document.body.classList.add('light-mode');
    if(viewMode === 'mobile') document.body.classList.add('mobile-mode');
    updateToggleButtonText();

    function recalculateKingOfTheHill() {
        stats = Array(MAX_P).fill(0);
        archive.forEach(g => {
            if (g.w && g.w.startsWith("Sieger: ")) {
                let sName = g.w.replace("Sieger: ", "").trim();
                let pIdx = pNames.findIndex(name => name && name.trim() === sName);
                if (pIdx !== -1) {
                    stats[pIdx]++;
                }
            } else if (g.w && g.w.startsWith("Unentschieden: ")) {
                let sNames = g.w.replace("Unentschieden: ", "").split(",").map(n => n.trim());
                sNames.forEach(sName => {
                    let pIdx = pNames.findIndex(name => name && name.trim() === sName);
                    if (pIdx !== -1) {
                        stats[pIdx]++;
                    }
                });
            }
        });
    }

    function save() { if(!isArcView) { localStorage.setItem('10k_names', JSON.stringify(pNames)); localStorage.setItem('10k_scores', JSON.stringify(scores)); localStorage.setItem('10k_archive', JSON.stringify(archive)); localStorage.setItem('10k_startIdx', startIdx); localStorage.setItem('10k_theme', theme); localStorage.setItem('10k_viewMode', viewMode); } }
    
    function toggleMobile() { 
        viewMode = (viewMode === 'desktop' ? 'mobile' : 'desktop'); 
        document.body.classList.toggle('mobile-mode'); 
        updateToggleButtonText();
        save(); 
        render(); 
    }

    function updateToggleButtonText() {
        const btn = document.getElementById('btnViewToggle');
        if(btn) btn.innerText = viewMode === 'mobile' ? '📱 DESKTOP' : '📱 MOBIL';
    }

    function toggleTheme() { theme = (theme === 'dark' ? 'light' : 'dark'); document.body.classList.toggle('light-mode'); save(); }

    function scrollCheck(el) {
        if(viewMode !== 'mobile') { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
        const pad = document.getElementById('padUI');
        const padTop = pad.getBoundingClientRect().top;
        const elRect = el.getBoundingClientRect();
        if (elRect.bottom > padTop - 120) { window.scrollBy({ top: elRect.bottom - padTop + 220, behavior: 'smooth' }); } 
        else if (elRect.top < 100) { window.scrollBy({ top: elRect.top - 120, behavior: 'smooth' }); }
    }

    function setV(v) { 
        if(isArcView || isLocked) return; 
        if (focus.pI === undefined || focus.r === undefined) {
            const sorted = getSortedActive();
            focus = { r: 0, pI: sorted[0].i, apIdx: 0 };
        }
        isLocked = true;
        const buttons = document.querySelectorAll('.pad-btn');
        buttons.forEach(b => b.disabled = true);
        scores[focus.r][focus.pI] = v.toString(); 
        isQuickPress = true;
        render(); 
        setTimeout(() => { 
            jumpToNext(); 
            isLocked = false; 
            buttons.forEach(b => b.disabled = false); 
        }, 500);
    }

    function jumpToNext() {
        const sorted = getSortedActive();
        let nAp = focus.apIdx + 1, nR = focus.r;
        if(nAp >= sorted.length) { nAp = 0; nR++; if(nR >= scores.length) scores.push(Array(MAX_P).fill("")); }
        focus = { r: nR, pI: sorted[nAp].i, apIdx: nAp };
        save(); render(); 
        setTimeout(() => {
            const el = document.getElementById(`input-${nR}-${sorted[nAp].i}`);
            if(el) {
                if(isQuickPress) { el.setAttribute('readonly', 'true'); el.focus(); setTimeout(() => el.removeAttribute('readonly'), 50); } 
                else { el.focus(); }
                scrollCheck(el);
            }
            isQuickPress = false; 
        }, 30);
    }

    function updateName(idx, val) {
        pNames[idx] = val;
        recalculateKingOfTheHill();
        save();
        updateUI(getSortedActive());
        const hCells = document.getElementById('hRow').querySelectorAll('th');
        const sorted = getSortedActive();
        sorted.forEach((p, i) => {
            if(hCells[i+1]) hCells[i+1].innerText = getHeaderNameWithAvg(p);
        });
    }

    function getHeaderNameWithAvg(p) {
        const activeScores = isArcView ? arcScores : scores;
        let sum = 0, count = 0;
        activeScores.forEach(r => {
            const v = parseInt(r[p.i]);
            if(!isNaN(v)) { sum += v; count++; }
        });
        let avg = count > 0 ? Math.round(sum / count) : 0;
        return `${p.n} (Ø:${avg})`;
    }

    function render() {
        recalculateKingOfTheHill();
        const activeScores = isArcView ? arcScores : scores;
        const activeNames = isArcView ? arcNames : pNames;
        const sorted = getSortedActive();
        if (sorted.length <= 4) {
            document.body.classList.add('few-players');
            document.body.classList.remove('many-players');
        } else {
            document.body.classList.add('many-players');
            document.body.classList.remove('few-players');
        }
        const nGrid = document.getElementById('namesGrid'); nGrid.innerHTML = '';
        activeNames.forEach((n, i) => {
            const div = document.createElement('div'); div.className = 'name-slot';
            div.innerHTML = `<input value="${n}" ${isArcView?'readonly':''} oninput="updateName(${i}, this.value)" placeholder="...">
                <button onclick="startIdx=${i}; save(); render();" ${isArcView?'disabled':''} class="btn-starter ${startIdx===i?'active':''}">${startIdx===i?'STARTER':'WAHL'}</button>`;
            nGrid.appendChild(div);
        });
        document.getElementById('hRow').innerHTML = '<th style="width: 35px;">RD</th>' + sorted.map(p => `<th>${getHeaderNameWithAvg(p)}</th>`).join('');
        const body = document.getElementById('gBody'); body.innerHTML = '';
        activeScores.forEach((row, rIdx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${rIdx+1}</td>`;
            sorted.forEach((p, apIdx) => {
                const td = document.createElement('td');
                const inp = document.createElement('input');
                inp.className = `score-input ${(!isArcView && focus.r===rIdx && focus.pI===p.i)?'system-focus':''}`;
                inp.value = activeScores[rIdx][p.i] || ""; inp.type = "number"; inp.id = `input-${rIdx}-${p.i}`;
                if(viewMode === 'mobile') inp.setAttribute('inputmode', 'none'); 
                inp.onfocus = () => { if(!isArcView) { focus = { r: rIdx, pI: p.i, apIdx }; scrollCheck(inp); } };
                inp.onkeydown = (e) => { if(e.key === "Enter" || e.key === "Tab") { e.preventDefault(); isQuickPress = false; jumpToNext(); } };
                inp.oninput = (e) => { if(!isArcView) { scores[rIdx][p.i] = e.target.value; save(); updateUI(sorted); } };
                td.appendChild(inp); tr.appendChild(td);
            });
            body.appendChild(tr);
        });
        updateUI(sorted);
    }

    function updateUI(sorted) {
        const activeScores = isArcView ? arcScores : scores;
        let dist = { ronny:{}, small:{}, med:{}, big:{}, elite:{}, meister:{} };
        let pendingWinners = [];

        sorted.forEach(p => {
            let total = 0;
            activeScores.forEach(r => {
                const v = parseInt(r[p.i]);
                if(!isNaN(v)) total += v;
            });
            if (total >= 10000) {
                pendingWinners.push(p.i);
            }
        });

        const f = document.getElementById('tRow'); f.innerHTML = '<td>Σ</td>';
        sorted.forEach(p => {
            let total = 0;
            activeScores.forEach(r => {
                const v = parseInt(r[p.i]);
                if(!isNaN(v)) {
                    total += v;
                    let cat = v===0?'ronny':v<=450?'small':v<=700?'med':v<=950?'big':v<=1500?'elite':'meister';
                    if(!dist[cat][p.i]) dist[cat][p.i] = 0;
                    dist[cat][p.i]++;
                }
            });
            let rest = 10000 - total;
            let statusClass = "";
            let displayText = rest;
            if (rest <= 0) {
                statusClass = "winner-blink";
                displayText = `👑 ${rest} 👑`;
            } else if (rest <= 1000) {
                statusClass = "near-win";
            }
            f.innerHTML += `<td><div class="score-box ${statusClass}"><span class="score-down">${displayText}</span><span class="score-up">${total}</span></div></td>`;
        });

        document.getElementById('statsDisp').innerHTML = sorted.map(p => {
            let isWinningNow = pendingWinners.includes(p.i) ? '<span class="pending-win">(+1)</span>' : '';
            return `<div class="stat-item"><span class="stat-name">${p.n}</span><span class="stat-wins">👑 ${stats[p.i]||0}${isWinningNow}</span></div>`;
        }).join('');

        const cats = [['RONNYS (0)','ronny'],['SMALL (bis 450)','small'],['MED (bis 700)','med'],['BIG (bis 950)','big'],['ELITE (bis 1500)','elite'],['MEISTER (über 1500)','meister']];
        document.getElementById('analysisUI').innerHTML = cats.map(c => {
            const details = sorted.map(p => `<div class="ana-row" style="font-size:0.9rem; margin-top:3px; display:flex; justify-content:between;"><span>${p.n}:</span> <b style="margin-left:auto;">${dist[c[1]][p.i] || 0}</b></div>`).join('');
            return `<div class="analysis-card"><div style="font-size:0.95rem; font-weight:bold; color:var(--accent); border-bottom: 1px solid var(--border); padding-bottom:3px; margin-bottom:5px;">${c[0]}</div>${details}</div>`;
        }).join('');
    }

    function getSortedActive() { const names = isArcView ? arcNames : pNames; const active = names.map((n, i) => ({n, i})).filter(p => p.n && p.n.trim() !== ""); const sPos = active.findIndex(p => p.i === startIdx); return (sPos === -1) ? active : [...active.slice(sPos), ...active.slice(0, sPos)]; }
    
    async function saveCSV() {
        const d = { pNames, scores, archive, startIdx };
        const jsonString = JSON.stringify(d);
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const fileName = `Würfel-Backup-${yy}.${mm}.${dd}-${hh}.${min}.csv`;
        const blob = new Blob([jsonString], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function loadCSV(e) { const r = new FileReader(); r.onload = (ev) => { try { const d = JSON.parse(ev.target.result); pNames=d.pNames; scores=d.scores; archive=d.archive; startIdx=d.startIdx; save(); render(); } catch(err) { alert("Fehler!"); } }; r.readAsText(e.target.files[0]); }
    
    function openHistory() { document.getElementById('histView').style.display = 'block'; renderArchiveList(); }
    
    function renderArchiveList() { 
        document.getElementById('arcList').innerHTML = archive.map((g, idx) => `
            <div class="history-item">
                <div><strong>${g.d}</strong><br><small>${g.w}</small></div>
                <div style="display: flex; gap: 5px;">
                    <button class="btn-load-hist" onclick="showArchiveGame(${idx})">LADEN</button>
                    <button class="btn-load-hist" style="background:var(--ronny);" onclick="deleteHistoryItem(${idx})">LÖSCHEN</button>
                </div>
            </div>`).join('') + (archive.length > 0 ? `<button class="btn-top" style="background:var(--ronny); width:100%; margin-top:15px; padding:10px 0;" onclick="clearAllHistory()">⚠️ GESAMTE HISTORIE LÖSCHEN</button>` : '<div style="color:#aaa; text-align:center; padding:20px;">Keine Einträge vorhanden</div>'); 
    }
    
    function deleteHistoryItem(idx) {
        if(confirm("Diesen Eintrag aus der Historie löschen? (Die Kronen-Statistik wird sofort live angepasst)")) {
            if(confirm("Bist du dir wirklich absolut sicher? Dieser Schritt kann nicht rückgängig gemacht werden!")) {
                archive.splice(idx, 1);
                save();
                renderArchiveList();
                render(); 
            }
        }
    }

    function clearAllHistory() {
        if(confirm("Möchtest du wirklich die GESAMTE Historie unwiderruflich löschen? (Dadurch werden auch ALLE Kronen zurückgesetzt)")) {
            if(confirm("Bist du dir wirklich absolut sicher? SÄMTLICHE Spiele und Statistiken gehen verloren!")) {
                archive = [];
                save();
                renderArchiveList();
                render();
            }
        }
    }

    function showArchiveGame(idx) { arcScores = JSON.parse(JSON.stringify(archive[idx].s)); arcNames = archive[idx].names || pNames; isArcView = true; document.getElementById('arcBanner').style.display = 'block'; document.getElementById('histView').style.display='none'; render(); }
    function exitArchive() { isArcView = false; document.getElementById('arcBanner').style.display = 'none'; render(); }
    
    function askMasterReset() { 
        if(confirm("Möchtest du wirklich das Board komplett zurücksetzen? (Dadurch werden ALLE Namen, aktuellen Punkte und die komplette Historie unwiderruflich gelöscht)")) {
            if(confirm("Bist du dir absolut sicher? Es gibt KEINE Möglichkeit, die Daten danach wiederherzustellen (außer du hast ein Backup)!")) {
                localStorage.clear(); 
                location.reload(); 
            }
        }
    }

    function finish() {
        const active = getSortedActive(); let winners = [];
        active.forEach(p => { let s = 0; scores.forEach(r => s += (parseInt(r[p.i]) || 0)); if(s >= 10000) { winners.push(p.n); } });
        
        let winText = "-";
        if (winners.length > 1) {
            winText = "Unentschieden: " + winners.join(", ");
        } else if (winners.length === 1) {
            winText = "Sieger: " + winners[0];
        } else {
            // Niemand hat 10.000 Punkte erreicht -> Sicherheitsabfrage wegen vorzeitigem Abbruch
            if (!confirm("Achtung: Es hat noch kein Spieler die 10.000 Punkte erreicht!\n\nMöchtest du dieses laufende Spiel wirklich vorzeitig abbrechen und eine neue Runde starten?")) {
                return; // Abbruch der Funktion, das Spiel läuft normal weiter
            }
            winText = "Vorzeitig beendet";
        }
        
        archive.unshift({ d: new Date().toLocaleString(), w: winText, s: JSON.parse(JSON.stringify(scores)), names: JSON.parse(JSON.stringify(pNames)) });
        scores = [Array(MAX_P).fill("")]; 
        const sorted = getSortedActive();
        focus = { r: 0, pI: sorted[0].i, apIdx: 0 };
        render(); save();
    }

    const pad = document.getElementById('padUI');
    for(let v=350; v<=1300; v+=50) { const b = document.createElement('button'); b.className='pad-btn'; b.innerText=v; b.onclick=()=>setV(v); pad.appendChild(b); }
    render();
</script>
</body>
</html>
